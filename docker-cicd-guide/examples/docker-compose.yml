version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: nex-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - nex-net

  backend:
    image: ${DOCKER_HUB_USERNAME}/nex-backend:${IMAGE_TAG:-latest}
    container_name: nex-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/jobsearch
    depends_on:
      - mongo
    networks:
      - nex-net

  frontend:
    image: ${DOCKER_HUB_USERNAME}/nex-frontend:${IMAGE_TAG:-latest}
    container_name: nex-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - nex-net

  nginx:
    image: nginx:alpine
    container_name: nex-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - nex-net

volumes:
  mongo_data:

networks:
  nex-net:
    driver: bridge
